[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nguyen-ai-assessment-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["assessment", "assessment.*"]
namespaces = false
